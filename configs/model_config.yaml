random_seed: 42

split_ratios:
  train: 0.60
  val: 0.20
  test: 0.20

feature_sets:
  cf1_only:
    - pa_cf1
    - relative_humidity
    - temperature
  atm_only:
    - pa_atm
    - relative_humidity
    - temperature
  alt_only:
    - pa_alt
    - relative_humidity
    - temperature
  all_channels:
    - pa_cf1
    - pa_atm
    - pa_alt
    - relative_humidity
    - temperature

temporal_features:
  cyclical:
    - hour_sin
    - hour_cos
    - day_of_year_sin
    - day_of_year_cos

calibration_models:
  linear_regression:
    fit_intercept: true
  random_forest:
    n_estimators: 100
    max_depth: 12
    min_samples_split: 5
    random_state: 42
    n_jobs: -1
  xgboost:
    n_estimators: 100
    max_depth: 6
    learning_rate: 0.08
    subsample: 0.85
    colsample_bytree: 0.85
    random_state: 42
    n_jobs: -1

reconstruction_models:
  linear_interpolation:
    method: "time"
  knn:
    n_neighbors: 5
    weights: "distance"
  random_forest:
    n_estimators: 50
    max_depth: 10
    random_state: 42
    n_jobs: -1
  gru:
    seq_len: 24
    input_dim: 8
    hidden_dim: 64
    num_layers: 2
    dropout: 0.1
    learning_rate: 0.001
    batch_size: 64
    epochs: 25
  lstm:
    seq_len: 24
    input_dim: 8
    hidden_dim: 64
    num_layers: 2
    dropout: 0.1
    learning_rate: 0.001
    batch_size: 64
    epochs: 25

missingness:
  rates: [0.05, 0.10, 0.20, 0.30]
  gap_hours: [1, 3, 6, 12, 24]
  seeds: [42, 101, 2024]
